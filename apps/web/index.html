<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07182C" />
    <title>POLSKI GO</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Панорама заставки вантажиться паралельно з JS (вона ж потрібна головній у Варшаві). -->
    <link rel="preload" as="image" href="/src/assets/splash/warszawa-portrait-900.webp" imagesrcset="/src/assets/splash/warszawa-portrait-900.webp 900w, /src/assets/splash/warszawa-portrait-1400.webp 1400w" imagesizes="(max-aspect-ratio: 9/16) 56vh, 100vw" />
    <script>
      // Профіль запитуємо одразу, паралельно із завантаженням JS: збереженим токеном і лише для того ж
      // власника, що й api.ts (authOwner). Без токена чи для іншого користувача — нічого не робимо.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('pg_auth') || 'null');
          if (!saved || !saved.token || saved.exp <= Date.now() + 3600000) return;
          var m = /(?:^|[#&])tgWebAppData=([^&]*)/.exec(location.hash);
          var user = m ? new URLSearchParams(decodeURIComponent(m[1])).get('user') : null;
          var owner = m ? (user ? String(JSON.parse(user).id) : '') : 'dev:' + (new URLSearchParams(location.search).get('devUser') || 100001);
          if (owner !== saved.owner) return;
          window.__pgEarlyMe = {
            token: saved.token,
            data: fetch(__PG_API_BASE__ + '/api/me', { headers: { authorization: 'Bearer ' + saved.token } })
              .then(function (r) { return r.ok ? r.json() : null; })
              .catch(function () { return null; }),
          };
        } catch (e) {}
      })();
    </script>
    <style>
      /* Миттєва заставка до завантаження JS: той самий фон і логотип на тому ж місці, що в Splash.tsx. */
      html, body { margin: 0; background: #07182c; }
      .pre-splash { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 5vh) 24px 0; background: #07182c; }
      .pre-splash img { width: min(84vw, 340px); height: auto; filter: drop-shadow(0 10px 16px rgb(7 24 44 / 0.45)); }
    </style>
  </head>
  <body>
    <div id="root"><div class="pre-splash" aria-hidden="true"><img src="/src/assets/brand/logo.webp" alt="" width="640" height="126" /></div></div>
    <!-- Офіційний SDK Telegram Mini Apps (після розмітки: заставку видно одразу) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
