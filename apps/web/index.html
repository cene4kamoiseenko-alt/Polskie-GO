<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2C92EA" />
    <title>POLSKI GO</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Миттєвий фон заставки до завантаження JS (без білого спалаху). */
      html, body { margin: 0; background: #2c92ea; }
      .pre-splash { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh;
        background: linear-gradient(180deg, #1672d8 0%, #2c92ea 22%, #5db6f4 46%, #a9ddfb 66%, #ddf2ff 80%, #f4e7cf 100%);
        font: 900 54px/1 Nunito, ui-rounded, system-ui, sans-serif; color: #fff; letter-spacing: -1px;
        text-shadow: 0 4px 0 #1c4fb0, 0 8px 0 #0e2758, 0 14px 22px rgba(7, 26, 58, 0.35); }
      .pre-splash b { color: #ff4f5e; margin-left: 10px; }
    </style>
  </head>
  <body>
    <div id="root"><div class="pre-splash" aria-hidden="true">POLSKI<b>GO</b></div></div>
    <!-- Офіційний SDK Telegram Mini Apps (після розмітки: фон заставки видно одразу) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
