<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07182C" />
    <title>POLSKI GO</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Заставка: спершу логотип (він малюється першим і задає FCP), потім фон (Варшава, шари власника); той самий srcset і sizes, що в <img> нижче й у Splash.tsx. -->
    <link rel="preload" as="image" href="/src/assets/splash/royal/logo.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/assets/splash/royal/orn.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/assets/splash/royal/bg.webp" imagesrcset="/src/assets/splash/royal/bg@640.webp 640w, /src/assets/splash/royal/bg.webp 941w" imagesizes="(max-aspect-ratio: 941/1672) calc(100vh * 0.5628), 100vw" fetchpriority="low" />
    <script>
      // Профіль запитуємо одразу, паралельно із завантаженням JS: збереженим токеном і лише для того ж
      // власника, що й api.ts (authOwner). Без токена чи для іншого користувача — нічого не робимо.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('pg_auth') || 'null');
          if (!saved || !saved.token || saved.exp <= Date.now() + 3600000) return;
          var m = /(?:^|[#&])tgWebAppData=([^&]*)/.exec(location.hash);
          var user = m ? new URLSearchParams(decodeURIComponent(m[1])).get('user') : null;
          var q = new URLSearchParams(location.search);
          var local = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) >= 0 && !q.has('standalone');
          // Как authOwner() в lib/api.ts: игрок Telegram, тестовый пользователь (localhost) или устройство (Android-приложение, веб).
          var owner = m ? (user ? String(JSON.parse(user).id) : '') : local ? 'dev:' + (q.get('devUser') || 100001) : 'device';
          if (owner !== saved.owner) return;
          window.__pgEarlyMe = {
            token: saved.token,
            data: fetch(__PG_API_BASE__ + '/api/me', { headers: { authorization: 'Bearer ' + saved.token } })
              .then(function (r) { return r.ok ? r.json() : null; })
              .catch(function () { return null; }),
          };
        } catch (e) {}
      })();
    </script>
    <style>
      /* Миттєва заставка до завантаження JS: той самий фон і логотип на тому ж місці й у тих же межах кадра 941×1672, що в Splash.tsx
         (сцена накриває екран як cover: --u — пікселів екрана на піксель кадра). Логотип з'являється тут один раз; далі його лише підхоплює React. */
      html, body { margin: 0; background: #07182c; }
      .pre-splash { --u: max(calc(100vw / 941), calc(100vh / 1672)); position: fixed; inset: 0; overflow: hidden; background: #07182c; }
      @supports (height: 100dvh) { .pre-splash { --u: max(calc(100vw / 941), calc(100dvh / 1672)); } }
      .pre-stage { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 941); height: calc(var(--u) * 1672); transform: translate(-50%, -50%); }
      .pre-bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease-out; }
      .pre-bg.on { opacity: 1; }
      /* Логотип с украшением — группа под шапкой Telegram, масштаб по ширине экрана (те же числа, что в index.css и lib/splashArt.ts). */
      .pre-brandbar { position: absolute; left: 0; right: 0; top: max(calc(var(--safe-t, 0px) + 12px), 44px); display: flex; justify-content: center; }
      .pre-lockup { --ug: min(calc(100vw / 941), calc(100vh / 1672 * 1.2)); position: relative; width: calc(var(--ug) * 694.7); height: calc(var(--ug) * 286.2);
        animation: pre-logo-arrive 0.85s cubic-bezier(0.2, 0.75, 0.25, 1) both; }
      @supports (height: 100dvh) { .pre-lockup { --ug: min(calc(100vw / 941), calc(100dvh / 1672 * 1.2)); } }
      .pre-orn, .pre-logo { position: absolute; display: block; object-fit: contain; }
      .pre-orn { left: 19.340%; top: 0; width: 61.033%; height: 46.823%; }
      .pre-logo { left: 0; top: 52.988%; width: 100%; height: 47.012%; }
      /* Не с нуля: элемент с opacity 0 браузер не засчитывает как первую отрисовку (FCP), а анимация идёт на композиторе и страницу не перерисовывает. */
      @keyframes pre-logo-arrive { from { transform: translateY(-15px) scale(0.94); opacity: 0.01; } }
      @media (prefers-reduced-motion: reduce) { .pre-lockup { animation: none; } .pre-bg { transition: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="pre-splash" aria-hidden="true"><div class="pre-stage">
      <img class="pre-bg" src="/src/assets/splash/royal/bg.webp" srcset="/src/assets/splash/royal/bg@640.webp 640w, /src/assets/splash/royal/bg.webp 941w" sizes="(max-aspect-ratio: 941/1672) calc(100vh * 0.5628), 100vw" width="941" height="1672" alt="" fetchpriority="low" />
    </div>
    <div class="pre-brandbar"><div class="pre-lockup">
      <img class="pre-orn" src="/src/assets/splash/royal/orn.webp" width="424" height="134" alt="" fetchpriority="high" />
      <img class="pre-logo" src="/src/assets/splash/royal/logo.webp" width="868" height="168" alt="" fetchpriority="high" />
    </div></div></div></div>
    <script>
      // Фон проявляється, коли завантажився; якщо встиг раніше, ніж дійшло до цього скрипта, — одразу. Без атрибута onload:
      // CSP (scripts/build-cf.mjs) дозволяє вбудовані скрипти лише за хешем, а обробники в атрибутах — ні.
      (function () { var i = document.querySelector('.pre-bg'); if (!i) return; var on = function () { i.classList.add('on'); }; if (i.complete) on(); else i.addEventListener('load', on); })();
    </script>
    <!-- Офіційний SDK Telegram Mini Apps (після розмітки: заставку видно одразу) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
