services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: polski
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polski}
      POSTGRES_DB: polskigo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polski']
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: apps/server/.env
    environment:
      DATABASE_URL: postgresql://polski:${POSTGRES_PASSWORD:-polski}@db:5432/polskigo
      NODE_ENV: production
      DEV_AUTH: 'false'
    volumes: [uploads:/app/apps/server/uploads]
    ports: ['3000:3000']
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
  uploads:
